name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS ships Bash 3.2
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm run lint
      - run: npm test                        # unit + robots + real-CLI integration (fixture)
      - run: bash test/shell-smoke.sh        # real gate: exit codes + Bash 3.2, no `|| true`
