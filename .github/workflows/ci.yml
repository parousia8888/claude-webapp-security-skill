name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS ships Bash 3.2
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '${{ matrix.node }}' }
      - run: npm run lint
      - run: npm test                        # unit + robots + real-CLI integration (fixture)
      - run: bash test/shell-smoke.sh        # real gate: exit codes + Bash 3.2, no `|| true`
